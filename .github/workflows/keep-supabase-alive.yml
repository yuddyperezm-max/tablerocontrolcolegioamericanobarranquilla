name: Keep Supabase alive

on:
  schedule:
    - cron: "0 13 * * 1,4"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Consultar la tabla flowers
        run: |
          curl -sf "https://snaplyxsmtxftypygxhc.supabase.co/rest/v1/flowers?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_SERVICE_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_KEY }}"
