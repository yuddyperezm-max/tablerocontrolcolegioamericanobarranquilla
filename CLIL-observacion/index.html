<title>Observación Pilotaje CLIL</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: navy institutional band + sticky tab bar; single column of block cards (A–J) sized for a tablet held in one hand */
:root{
  --bg:#F5F7FB; --surface:#FFFFFF; --ink:#14213D; --muted:#5A6684; --line:#DCE2EE;
  --navy:#0A2D73; --petrol:#197AA4; --amber:#EC8906; --amber-soft:#FDF0DC;
  --head:#0A2D73; --head-ink:#FFFFFF; --head-muted:#B9C7E6;
  --sel:#0A2D73; --sel-ink:#FFFFFF; --chip:#EEF2F9;
  --good:#2D7A4E; --good-soft:#E3F2E9; --warn:#A66300; --warn-soft:#FBEED9; --bad:#B3261E; --bad-soft:#FBE6E4;
  --f-body:"Atkinson Hyperlegible", "Segoe UI", Tahoma, sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0C1322; --surface:#141E34; --ink:#E7ECF6; --muted:#9BA7C2; --line:#27344F;
  --navy:#9DBBF7; --petrol:#62BCE0; --amber:#F4A53C; --amber-soft:#3A2911;
  --head:#0E1D40; --head-ink:#FFFFFF; --head-muted:#9FB2DA;
  --sel:#9DBBF7; --sel-ink:#0C1322; --chip:#1C2842;
  --good:#6CC495; --good-soft:#163426; --warn:#F2B35A; --warn-soft:#3A2A10; --bad:#F08A82; --bad-soft:#3D1A18;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0C1322; --surface:#141E34; --ink:#E7ECF6; --muted:#9BA7C2; --line:#27344F;
  --navy:#9DBBF7; --petrol:#62BCE0; --amber:#F4A53C; --amber-soft:#3A2911;
  --head:#0E1D40; --head-ink:#FFFFFF; --head-muted:#9FB2DA;
  --sel:#9DBBF7; --sel-ink:#0C1322; --chip:#1C2842;
  --good:#6CC495; --good-soft:#163426; --warn:#F2B35A; --warn-soft:#3A2A10; --bad:#F08A82; --bad-soft:#3D1A18;
  color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--head)}
.wrap{max-width:900px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{text-wrap:balance;margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--amber);outline-offset:2px}

/* masthead */
.mast{background:var(--head);color:var(--head-ink)}
.mast .wrap{padding-block:18px 14px;display:flex;gap:14px;align-items:center}
.mast img{width:46px;height:auto;background:#fff;border-radius:8px;padding:4px}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--amber);font-weight:700}
.mast h1{font-size:clamp(20px,4vw,26px);line-height:1.15}
.mast p{margin:2px 0 0;color:var(--head-muted);font-size:14px}

/* sticky bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.bar .wrap{display:flex;flex-direction:column;gap:8px;padding-block:10px}
.ctx{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.ctx select{flex:1 1 260px;min-width:0}
.ctx .roles{display:flex;gap:6px}
.save{font-size:12px;color:var(--muted);font-family:var(--f-mono)}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.tabs button{border:0;background:transparent;padding:8px 12px;border-radius:8px;font-weight:700;color:var(--muted);white-space:nowrap}
.tabs button[aria-selected="true"]{background:var(--chip);color:var(--navy);box-shadow:inset 0 -3px 0 var(--amber)}

main .wrap{padding-block:18px 60px;display:flex;flex-direction:column;gap:16px}
.view[hidden]{display:none!important}

/* block cards */
.blk{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:14px;min-width:0}
.blk-h{display:flex;gap:12px;align-items:flex-start}
.badge{flex:none;width:34px;height:34px;border-radius:8px;background:var(--navy);color:var(--surface);display:grid;place-items:center;font-weight:700;font-family:var(--f-mono)}
.blk-h h2{font-size:19px}
.blk-h .when{font-size:13px;color:var(--muted)}
.when b{color:var(--petrol)}
.rule{font-size:13px;color:var(--muted);background:var(--chip);border-radius:8px;padding:8px 10px}
.rule strong{color:var(--ink)}
.phase{display:flex;align-items:center;gap:10px;font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--petrol);margin-top:6px}
.phase::after{content:"";flex:1;height:1px;background:var(--line)}

.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field > label,.lbl{font-weight:700;font-size:14px}
.lbl small,.field > label small{font-weight:400;color:var(--muted)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
input[type=text],input[type=number],input[type=date],input[type=time],select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 10px;width:100%;min-width:0}
textarea{min-height:64px;resize:vertical}

.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--chip);border-radius:999px;padding:7px 12px;font-size:14px;line-height:1.2;text-align:left;min-height:38px}
.chip[aria-pressed="true"]{background:var(--sel);color:var(--sel-ink);border-color:var(--sel);font-weight:700}
.chip.urg[aria-pressed="true"]{background:var(--amber);border-color:var(--amber);color:#1B1206}
.chip:disabled{opacity:.4;cursor:not-allowed}

.seg{border-top:1px solid var(--line);padding-top:12px;display:flex;flex-direction:column;gap:10px}
.seg:first-of-type{border-top:0;padding-top:0}
.seg h3{font-size:15px;color:var(--navy)}

/* counters */
.ctr{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--bg)}
.ctr button{border:0;background:transparent;width:44px;height:44px;font-size:22px;font-weight:700;color:var(--navy)}
.ctr button:active{background:var(--chip)}
.ctr output{min-width:42px;text-align:center;font-family:var(--f-mono);font-size:18px;font-weight:600;font-variant-numeric:tabular-nums}
.row{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center}
.ind{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.ind:first-child{border-top:0}
.code{font-family:var(--f-mono);font-weight:600;color:var(--petrol);font-size:14px}
.ind .txt{min-width:0}
.ind .txt small{display:block;color:var(--muted);font-size:12px}
.pill{display:inline-block;font-size:12px;font-weight:700;padding:3px 8px;border-radius:999px;background:var(--chip);color:var(--muted);white-space:nowrap}
.pill.lo{background:var(--warn-soft);color:var(--warn)}
.pill.mid{background:var(--chip);color:var(--petrol)}
.pill.hi{background:var(--good-soft);color:var(--good)}
.pill.exp{background:var(--amber-soft);color:var(--amber)}
.sweep{display:grid;gap:10px;padding:12px;border:1px solid var(--line);border-radius:10px}
.sweep .top{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.sweep .pct{font-family:var(--f-mono);font-size:22px;font-weight:600;font-variant-numeric:tabular-nums}
.tbtn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 10px;font-size:14px;font-weight:700;color:var(--petrol)}
.time{font-family:var(--f-mono);font-size:14px;color:var(--muted)}
.ep{display:grid;gap:8px;padding:12px;border:1px dashed var(--line);border-radius:10px}
.hint{font-size:13px;color:var(--petrol);font-weight:700}
.warnline{font-size:13px;color:var(--warn);font-weight:700}
.dim{opacity:.55}

/* actions */
.actions{display:flex;flex-wrap:wrap;gap:8px}
.btn{border:1px solid var(--navy);background:var(--navy);color:var(--surface);border-radius:10px;padding:10px 14px;font-weight:700}
.btn.ghost{background:transparent;color:var(--navy)}
.btn.danger{border-color:var(--bad);background:transparent;color:var(--bad)}
.note{font-size:13px;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:700;z-index:40;max-width:calc(100% - 32px)}

/* results */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.kpi{border:1px solid var(--line);border-radius:10px;padding:12px}
.kpi .v{font-family:var(--f-mono);font-size:24px;font-weight:600;font-variant-numeric:tabular-nums}
.kpi .k{font-size:13px;color:var(--muted)}
.prof{display:grid;grid-template-columns:110px repeat(3,minmax(0,1fr));gap:6px;align-items:center;font-size:13px}
.prof .h{font-weight:700;color:var(--muted)}
.cell{border-radius:6px;padding:6px 8px;text-align:center;font-weight:700;background:var(--chip);color:var(--muted)}
.cell.b75{background:var(--navy);color:var(--surface)}
.cell.bmix{background:var(--petrol);color:var(--surface)}
.cell.b25{background:var(--amber-soft);color:var(--amber)}
.hbar{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,2fr) auto;gap:10px;align-items:center;font-size:14px;padding:4px 0}
.track{height:12px;border-radius:6px;background:var(--chip);overflow:hidden}
.fill{height:100%;background:var(--petrol);border-radius:6px}
.fill.am{background:var(--amber)}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:13px;white-space:nowrap}
.prog{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px}
.pg{border:1px solid var(--line);border-radius:8px;padding:8px;font-size:13px;display:flex;justify-content:space-between;gap:6px}
.pg.ok{border-color:var(--good);color:var(--good);font-weight:700}

/* tables */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{background:var(--chip);font-size:13px;color:var(--muted)}
tr.dis td{background:var(--warn-soft)}
td.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.agree{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}

/* photos */
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.ph{border:1px solid var(--line);border-radius:10px;overflow:hidden;display:flex;flex-direction:column}
.ph img{width:100%;aspect-ratio:4/3;object-fit:cover;max-width:100%}
.ph input{border:0;border-top:1px solid var(--line);border-radius:0}
.ph button{border:0;border-top:1px solid var(--line);background:transparent;color:var(--bad);padding:6px;font-size:13px;font-weight:700}

/* report */
.report{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px;display:flex;flex-direction:column;gap:14px}
.report h2{font-size:22px;color:var(--navy)}
.report h3{font-size:16px;color:var(--petrol);margin-top:6px}
.rhead{display:flex;gap:12px;align-items:center;border-bottom:3px solid var(--navy);padding-bottom:10px}
.rhead img{width:44px}
.rhead .t{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700}
.report figure{margin:0;break-inside:avoid}
.report figure img{max-height:260px;width:auto;border-radius:6px}
.report figcaption{font-size:13px;color:var(--muted)}

@media (max-width:520px){
  .prof{grid-template-columns:80px repeat(3,minmax(0,1fr));font-size:12px}
  .ind{grid-template-columns:auto 1fr}
  .ind .ctrwrap{grid-column:1 / -1;display:flex;justify-content:space-between;align-items:center}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
@media print{
  :root{--bg:#fff;--surface:#fff;--ink:#000;--muted:#444;--line:#bbb;--chip:#f1f3f7;--navy:#0A2D73;--petrol:#197AA4}
  body::before,.mast,.bar,.view:not(#v-report),#v-report > .noprint{display:none!important}
  #v-report{display:block!important}
  .report{border:0;padding:0}
  main .wrap{padding:0}
  .tw{overflow:visible}
}
</style>
<style>
/* additions */
.stephead{display:flex;gap:14px;align-items:flex-start;margin-top:18px;padding:14px 16px;border-radius:12px;background:var(--head);color:var(--head-ink)}
.stephead h2{font-size:20px}
.stephead p{margin:4px 0 0;color:var(--head-muted);font-size:14px}
.snum{flex:none;width:38px;height:38px;border-radius:50%;background:var(--amber);color:#1B1206;display:grid;place-items:center;font-weight:700;font-size:18px;font-family:var(--f-mono)}
h3.ct{font-size:18px;color:var(--navy)}
.mom .btn[data-start]{padding:8px 14px}

.ctx select{flex:1 1 220px}
.ctx .obsSel{flex:0 1 180px}
.plan{border:1px solid var(--line);border-radius:10px;overflow:hidden}
.plan dl{margin:0;display:grid;grid-template-columns:minmax(0,190px) minmax(0,1fr)}
.plan dt,.plan dd{margin:0;padding:8px 10px;border-top:1px solid var(--line);font-size:14px}
.plan dt{font-weight:700;color:var(--muted);background:var(--chip)}
.plan dl > :nth-child(1),.plan dl > :nth-child(2){border-top:0}
.plan ul{margin:0;padding-left:18px}
.fromplan{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--petrol);background:var(--chip);border-radius:6px;padding:2px 6px}
.pending{color:var(--warn);font-weight:700}
.mom{border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:12px}
.mom-h{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:flex-start}
.mom-h h3{font-size:17px;color:var(--navy)}
.mnum{font-family:var(--f-mono);font-weight:600;color:var(--amber);margin-right:6px}
.planbox{font-size:13px;color:var(--muted);background:var(--chip);border-radius:8px;padding:8px 10px}
.planbox b{color:var(--ink)}
.mins{font-family:var(--f-mono);font-size:13px;font-variant-numeric:tabular-nums}
.mins.over{color:var(--warn)}
.scaf{display:grid;gap:6px}
.scaf .row{gap:8px}
.tipo{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--petrol);min-width:82px}
.fst{display:grid;gap:10px}
.fcard{border:1px solid var(--line);border-radius:10px;padding:10px;display:grid;gap:8px}
.fcard .top{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.unit{display:grid;grid-template-columns:90px 1fr;gap:8px;align-items:center;padding:6px 0;border-top:1px solid var(--line)}
.unit:first-child{border-top:0}
.jrow{border:1px solid var(--line);border-radius:10px;padding:10px;display:grid;gap:8px}
.tl{display:grid;grid-template-columns:150px minmax(0,1fr) 110px;gap:8px;align-items:center;font-size:13px;padding:4px 0}
.tl .bars{display:grid;gap:3px}
.tl .b{height:9px;border-radius:5px;background:var(--chip)}
.tl .b i{display:block;height:100%;border-radius:5px}
.tl .b.p i{background:var(--line)}
.tl .b.o i{background:var(--petrol)}
.row #gSum,#gSum{white-space:normal;line-height:1.4}
.lens{display:grid;gap:8px;border:1px solid var(--line);border-radius:10px;padding:12px}
@media (max-width:520px){.plan dl{grid-template-columns:1fr}.plan dt{border-top:1px solid var(--line)}.tl{grid-template-columns:1fr}}
</style>
<style>
.ficha details{margin-top:4px}
.ficha summary{cursor:pointer;font-weight:700;color:var(--petrol);font-size:14px}
.prodrow{display:grid;grid-template-columns:96px 1fr;gap:8px;align-items:center;padding:6px 0;border-top:1px solid var(--line)}
.prodrow:first-child{border-top:0}
.cnt{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center}
select[data-add]{max-width:100%}
.big{font-family:var(--f-mono);font-size:22px;font-weight:600;font-variant-numeric:tabular-nums}
</style>

const toCSV=rows=>{const cols=[...new Set(rows.flatMap(Object.keys))],q=v=>{v=v==null?'':String(v);return /[",;\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};return '﻿'+cols.join(';')+'\n'+rows.map(r=>cols.map(c=>q(r[c])).join(';')).join('\n')};

let R1=null,R2=null,cmp=null,cons=null;
function spec(a){const ao=ayuOpts(a.id),f=[];
  M.forEach(([k])=>{f.push({g:'Momentos',path:`m.${k}.des`,label:`${k} · cómo se desarrolló`,type:'cat',opts:O.des});
    f.push({g:'Momentos',path:`m.${k}.ingD`,label:`${k} · inglés del docente`,type:'cat',opts:O.ingD});
    f.push({g:'Momentos',path:`m.${k}.ingE`,label:`${k} · inglés de los estudiantes`,type:'cat',opts:O.ingE});
    f.push({g:'Ayudas',path:`m.${k}.ayu`,label:`${k} · ayuda usada`,type:'multi',opts:ao});
    f.push({g:'Instrucciones',path:`m.${k}.instr`,label:`${k} · cómo dio las instrucciones`,type:'cat',opts:O.instr});
    f.push({g:'Instrucciones',path:`m.${k}`,label:`${k} · empezaron la tarea`,type:'emp'});
    EV.forEach(([e,t])=>f.push({g:'Eventos',path:`m.${k}.ev.${e}`,label:`${k} · ${t}`,type:'ev'}))});
  f.push({g:'Condiciones',path:'cond.mat',label:'Materiales',type:'cat',opts:O.mat});
  f.push({g:'Condiciones',path:'cond.tiempo',label:'Tiempo',type:'cat',opts:O.tiempo});
  PRC.forEach(([k,t])=>f.push({g:'Producto final',path:'prod.'+k,label:`Productos ${t.toLowerCase()}`,type:'num'}));
  f.push({g:'Qué funcionó',path:'func',label:'Qué funcionó',type:'multi',opts:O.func});
  f.push({g:'Apoyos 2027',path:'apD',label:'Apoyos para el docente',type:'multi',opts:O.apD});
  f.push({g:'Apoyos 2027',path:'apE',label:'Apoyos para los estudiantes',type:'multi',opts:O.apE});
  return f}
function compare(a,b){const rows=[],st={};const add=(g,ok,c)=>{st[g]=st[g]||{a:0,n:0};if(!c)return;st[g].n++;if(ok)st[g].a++};
  const tol=Math.max(2,Math.round(.1*Math.max(+a.N||0,+b.N||0)));
  spec(a).forEach(sp=>{const va=getP(a,sp.path),vb=getP(b,sp.path);
    if(sp.type==='cat'){if(!va&&!vb)return;const c=!!va&&!!vb;const ok=va===vb;add(sp.g,ok,c);rows.push({sp,va:lab(sp.opts,va)||'—',vb:lab(sp.opts,vb)||'—',ok})}
    else if(sp.type==='ev'){if(!va&&!vb)return;const ok=band(va)===band(vb);add(sp.g,ok,true);rows.push({sp,va:String(va),vb:String(vb),ok})}
    else if(sp.type==='emp'){if(!hasInstr(va)&&!hasInstr(vb))return;const c=hasInstr(va)&&hasInstr(vb);const ok=c&&Math.abs(va.emp-vb.emp)<=tol;add(sp.g,ok,c);rows.push({sp,va:hasInstr(va)?String(va.emp):'—',vb:hasInstr(vb)?String(vb.emp):'—',ok,note:`Coinciden si la diferencia es de ${tol} o menos`,set:'emp'})}
    else if(sp.type==='num'){if(!va&&!vb)return;const ok=Math.abs(va-vb)<=1;add(sp.g,ok,true);rows.push({sp,va:String(va),vb:String(vb),ok,note:'Coinciden si la diferencia es de 1 o menos'})}
    else if(sp.type==='multi'){const A=va||[],B=vb||[];[...new Set([...A,...B])].forEach(it=>{const ok=A.includes(it)&&B.includes(it);add(sp.g,ok,true);rows.push({sp,item:it,label2:lab(sp.opts,it)||it,va:A.includes(it)?'Sí':'No',vb:B.includes(it)?'Sí':'No',ok})})}
  });return {rows,st}}
const desc=r=>`${cls(r.id).docente} · ${r.rol||'sin O1/O2'} · ${r.obs||'sin observador'}`;

function renderCmp(){const {rows,st}=cmp,tot=Object.values(st).reduce((a,s)=>({a:a.a+s.a,n:a.n+s.n}),{a:0,n:0}),dis=rows.filter(r=>!r.ok);
  let h=`<article class="blk"><h3 class="ct">¿En qué coinciden?</h3><div class="agree">${Object.entries(st).map(([g,s])=>`<div class="kpi"><div class="k">${g}</div><div class="v">${s.n?Math.round(100*s.a/s.n)+' %':'—'}</div><div class="note">${s.a} de ${s.n}</div></div>`).join('')}<div class="kpi" style="border-color:var(--navy)"><div class="k">Total</div><div class="v">${tot.n?Math.round(100*tot.a/tot.n)+' %':'—'}</div><div class="note">${tot.a} de ${tot.n}</div></div></div></article>`;
  h+=`<article class="blk"><h3 class="ct">Diferencias para acordar (${dis.length})</h3><p class="note">Recuerden lo que vieron y decidan juntos. Si no logran acordar, elijan “Sin acuerdo”. No se promedia ni se vota.</p><div class="tw"><table><thead><tr><th>Pregunta</th><th>Registro 1</th><th>Registro 2</th><th>Acordado</th></tr></thead><tbody>`;
  dis.forEach((r,i)=>{let ctl;if(r.sp.type==='cat')ctl=`<select id="cv${i}"><option value="">Elegir</option>${r.sp.opts.map(o=>`<option value="${esc(o[0])}">${esc(o[1])}</option>`).join('')}<option value="__p">Sin acuerdo</option></select>`;
    else if(r.sp.type==='multi')ctl=`<select id="cv${i}"><option value="">Elegir</option><option value="1">Sí</option><option value="0">No</option><option value="__p">Sin acuerdo</option></select>`;
    else ctl=`<input type="number" min="0" id="cv${i}" placeholder="Número">`;
    h+=`<tr class="dis"><td>${esc(r.sp.label)}${r.label2?`<br><strong>${esc(r.label2)}</strong>`:''}${r.note?`<br><span class="note">${esc(r.note)}</span>`:''}</td><td>${esc(r.va)}</td><td>${esc(r.vb)}</td><td>${ctl}</td></tr>`});
  if(!dis.length)h+='<tr><td colspan="4">No hay diferencias.</td></tr>';
  h+=`</tbody></table></div><div class="actions"><button type="button" class="btn" id="expCons">${canDL()?'Guardar registro acordado':'Copiar registro acordado'}</button><button type="button" class="btn ghost" id="repCons">Ver reporte acordado</button></div></article>`;
  $('#conOut').innerHTML=h}
function buildCons(){const o1=R1.rol==='O1'?R1:R2.rol==='O1'?R2:R1,c=JSON.parse(JSON.stringify(o1));
  c.consenso=true;c.obs=`${R1.obs||'?'} + ${R2.obs||'?'}`;c.rol='Acordado';c.doc=JSON.parse(JSON.stringify(o1.doc));
  M.forEach(([k])=>{c.m[k].nota=[R1.m[k].nota,R2.m[k].nota].filter(Boolean).join(' / ')});
  let pend=0;const log=[];
  cmp.rows.filter(r=>!r.ok).forEach((r,i)=>{const el=$('#cv'+i),v=el?el.value:'';const en={pregunta:r.sp.label+(r.label2?' · '+r.label2:''),r1:r.va,r2:r.vb,acordado:''};
    if(!v||v==='__p'){pend++;en.acordado='Sin acuerdo';if(r.sp.type==='cat')setP(c,r.sp.path,'');if(r.sp.type==='multi')setP(c,r.sp.path,(getP(c,r.sp.path)||[]).filter(x=>x!==r.item))}
    else if(r.sp.type==='cat'){setP(c,r.sp.path,v);en.acordado=lab(r.sp.opts,v)}
    else if(r.sp.type==='multi'){const a=(getP(c,r.sp.path)||[]).filter(x=>x!==r.item);if(v==='1')a.push(r.item);setP(c,r.sp.path,a);en.acordado=v==='1'?'Sí':'No'}
    else if(r.sp.type==='emp'){getP(c,r.sp.path).emp=+v;en.acordado=v}
    else{setP(c,r.sp.path,+v);en.acordado=v}
    log.push(en)});

  h+=T(['Dato','','Dato',''],[['Grupo',esc(c.grupo||'—'),'Fecha',esc(fdate(c)||'—')],['Asignatura',esc(p&&p.subject||'—'),'Tema',esc(p&&p.topic||'—')],['Estudiantes',n||'—','Observador',esc(r.obs||'—')+(r.rol?' · '+esc(r.rol):'')]]);
  if(p)h+=`<p><strong>Qué deben comprender:</strong> ${esc(p.content)}<br><strong>Producto final:</strong> ${esc(p.performance)}</p>`;
  if(r.consenso&&r.acuerdo)h+=`<h3>Coincidencia entre observadores</h3>`+T(['Parte','Coinciden','%'],Object.entries(r.acuerdo).map(([g,s])=>[g,`${s.a} de ${s.n}`,s.n?Math.round(100*s.a/s.n)+' %':'—']))+`<p class="note">Diferencias sin acuerdo: ${r.pendientes||0}.</p>`;
  h+=`<h3>Los cuatro momentos</h3>`+T(['Momento','Cómo se desarrolló','Inglés del docente','Inglés de los estudiantes','Ayudas usadas','Instrucciones','Nota'],M.map(([k,t])=>{const m=r.m[k];return [`${k} ${t}`,esc(lab(O.des,m.des)||'—'),esc(lab(O.ingD,m.ingD)||'—'),esc(lab(O.ingE,m.ingE)||'—'),esc(m.ayu.map(v=>lab(ao,v)).join('; ')||'—'),esc(lab(O.instr,m.instr)||'—')+(hasInstr(m)?`<br>Empezaron: ${m.emp}${n?' de '+n:''}`:''),esc(m.nota||'—')]}));
  h+=`<h3>Resumen de eventos</h3><div class="tw">${sumHTML(r)}</div>`;
  h+=`<h3>Condiciones</h3><p>Materiales: ${esc(lab(O.mat,r.cond.mat)||'—')} · Tiempo: ${esc(lab(O.tiempo,r.cond.tiempo)||'—')}</p>`;
  const pt=r.prod.A+r.prod.P+r.prod.N;h+=`<h3>Producto final</h3><p>${pt?`Revisados ${pt}: adecuados ${r.prod.A} · parciales ${r.prod.P} · no adecuados ${r.prod.N}`:'Sin revisar'}</p>`;
  h+=`<h3>Qué funcionó</h3><p>${esc(r.func.map(x=>lab(O.func,x)).join(' · ')||'—')}</p>`;
  h+=`<h3>Apoyos para 2027</h3><p><strong>Docente:</strong> ${esc(r.apD.map(x=>lab(O.apD,x)).join(' · ')||'—')}<br><strong>Estudiantes:</strong> ${esc(r.apE.map(x=>lab(O.apE,x)).join(' · ')||'—')}</p>`;
  if(Object.values(r.doc).some(Boolean))h+=`<h3>Conversación con el docente</h3>`+T(['Pregunta','Respuesta'],[['¿Cómo se sintió?',esc(lab(O.comodo,r.doc.comodo)||'—')],['Momento que más cambió',esc(lab(O.cambio,r.doc.cambio)||'—')+(r.doc.porque?': '+esc(r.doc.porque):'')],['Apoyo que le ayudaría',esc(lab(O.apD,r.doc.apoyo)||'—')]]);
  if(r.diferencias&&r.diferencias.length)h+=`<h3>Diferencias y acuerdos</h3>`+T(['Pregunta','Registro 1','Registro 2','Acordado'],r.diferencias.map(d=>[esc(d.pregunta),esc(d.r1),esc(d.r2),esc(d.acordado)]));
  h+=`<p class="note">Registro descriptivo del pilotaje CLIL 2026. Las diferencias con lo planeado describen lo que es posible en el aula; no evalúan al docente. Generado ${new Date().toLocaleString('es-CO')}.</p>`;return h}

/* ---------- inicio ---------- */
buildSel();buildObs();sync();
if(window.claude&&window.claude.use){window.claude.use('downloads').then(d=>{if(!d)return;DL=d;const y=window.scrollY;buildObs();sync();window.scrollTo(0,y);if(!$('#v-rep').hidden)renderRep()}).catch(()=>{})}
})();
</script>
